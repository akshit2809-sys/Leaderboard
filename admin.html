<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Top Spot</title>
<style>
:root{
  --bg:#f3eeff; --card:#ffffff; --ink:#1e1147; --mute:#6a5f8f; --line:#ddd3f7;
  --a1:#6c3cf0; --a2:#ff3d8b; --ok:#00846e; --bad:#d6264f;
  --body:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#140b33; --card:#1f1450; --ink:#f1ebff; --mute:#a99bd6; --line:#35266f; --a1:#8f6bff; --a2:#ff5fa2; --ok:#2ee6c8; --bad:#ff6b8b; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:18px}
label{display:grid;gap:4px;font-size:14px;font-weight:600;margin-bottom:12px}
input{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:10px;font:inherit;color:inherit;width:100%}
input:focus{border-color:var(--a1);outline:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--a1);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.small{padding:6px 12px;font-size:14px}
.msg{min-height:22px;font-size:14px;margin-top:8px;color:var(--bad)}
.msg.good{color:var(--ok)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.who{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--a1);border-color:var(--a1);color:#fff}
.row{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.nm{font-weight:700;word-break:break-word}
.nm a{color:var(--a1)}
.pt{color:var(--mute);font-size:14px;word-break:break-word}
.meta{color:var(--mute);font-size:13px;margin-top:4px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-left:8px;vertical-align:middle}
.b-approved{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.b-pending{background:color-mix(in srgb,#ff9a1f 25%,transparent);color:#b86a00}
.b-rejected{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Top Spot admin</h1>
  <p class="sub">Private page. Do not share this address.</p>

  <div id="login" class="card" hidden style="max-width:380px">
    <form id="lf" novalidate>
      <label>Email<input id="em" type="email" autocomplete="username" required></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="lb" type="submit">Sign in</button>
      <div class="msg" id="lmsg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <span class="who" id="who"></span>
      <span>
        <button class="btn ghost small" id="refresh" type="button">Refresh</button>
        <button class="btn ghost small" id="out" type="button">Sign out</button>
      </span>
    </div>
    <div class="tabs" id="tabs"></div>
    <label style="margin-bottom:14px"><span>Search by name or website</span><input id="q" type="search" autocomplete="off"></label>
    <div class="msg" id="amsg" role="status" aria-live="polite"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  var SB='https://ktbvylebworucfcmlnhc.supabase.co';
  var KEY='sb_publishable_d2AJBW1DIpcYXUJnLeFJ-Q_-DKFvDHV';
  var S=null,rows=[],flt='all',q='';
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function cleanUrl(u){try{var x=new URL(u);return(x.protocol==='http:'||x.protocol==='https:')?x.href:null}catch(e){return null}}
  function lmsg(t){$('lmsg').textContent=t}
  function amsg(t,good){var m=$('amsg');m.textContent=t;m.className='msg'+(good?' good':'')}

  try{S=JSON.parse(sessionStorage.getItem('ts-admin'))}catch(e){S=null}
  function save(){try{if(S)sessionStorage.setItem('ts-admin',JSON.stringify(S));else sessionStorage.removeItem('ts-admin')}catch(e){}}

  function call(path,opts){
    opts=opts||{};
    var h={apikey:KEY,'Content-Type':'application/json'};
    if(opts.token)h.Authorization='Bearer '+opts.token;
    if(opts.prefer)h.Prefer=opts.prefer;
    return fetch(SB+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
      .then(function(r){return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null}catch(e){}
        if(!r.ok){var err=new Error((d&&(d.message||d.msg||d.error_description))||'Request failed');err.status=r.status;throw err}
        return d})});
  }
  function setSession(d){
    S={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+d.expires_in*1000,email:(d.user&&d.user.email)||(S&&S.email)||''};
    save();return S;
  }
  function refresh(){
    return call('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:S.refresh_token}}).then(setSession)
      .catch(function(){signOut('Session expired. Please sign in again.');throw new Error('Session expired')});
  }
  function authed(path,opts){
    opts=opts||{};
    if(!S)return Promise.reject(new Error('Not signed in'));
    var p=(S.expires_at-Date.now()<60000)?refresh():Promise.resolve();
    return p.then(function(){opts.token=S.access_token;return call(path,opts)})
      .catch(function(e){if(e.status===401)signOut('Session expired. Please sign in again.');throw e});
  }
  function checkAdmin(){return authed('/rest/v1/admins?select=user_id').then(function(d){return !!(d&&d.length)})}

  function showLogin(){$('login').hidden=false;$('app').hidden=true}
  function signOut(msg){
    var t=S&&S.access_token;
    if(t)call('/auth/v1/logout',{method:'POST',token:t}).catch(function(){});
    S=null;save();rows=[];showLogin();lmsg(msg||'');
  }
  function start(){
    $('login').hidden=true;$('app').hidden=false;
    $('who').textContent='Signed in as '+(S.email||'admin');
    amsg('Loading…');load();
  }

  function load(){
    return authed('/rest/v1/listings?select=id,name,url,pitch,total_paid,clicks,status,created_at&order=created_at.desc&limit=1000')
      .then(function(d){rows=d||[];amsg('');render()})
      .catch(function(e){if(S)amsg('Could not load listings: '+e.message)});
  }

  function render(){
    var counts={all:rows.length,approved:0,pending:0,rejected:0};
    rows.forEach(function(l){counts[l.status]=(counts[l.status]||0)+1});
    var tabs=$('tabs');tabs.textContent='';
    [['all','All'],['approved','Live'],['pending','Pending'],['rejected','Removed']].forEach(function(t){
      var b=el('button','tab',t[1]+' ('+(counts[t[0]]||0)+')');b.type='button';b.setAttribute('aria-pressed',flt===t[0]?'true':'false');
      b.addEventListener('click',function(){flt=t[0];render()});tabs.appendChild(b);
    });
    var live=rows.filter(function(l){return l.status==='approved'}).sort(function(a,b){return b.total_paid-a.total_paid||new Date(a.created_at)-new Date(b.created_at)});
    var rank={};live.forEach(function(l,i){rank[l.id]=i+1});
    var ql=q.toLowerCase();
    var list=rows.filter(function(l){
      if(flt!=='all'&&l.status!==flt)return false;
      return !ql||l.name.toLowerCase().indexOf(ql)>-1||l.url.toLowerCase().indexOf(ql)>-1;
    });
    var out=$('list');out.textContent='';
    if(!list.length)out.appendChild(el('p','sub','Nothing to show here.'));
    list.forEach(function(l){
      var r=el('div','row');var left=el('div');
      var nm=el('div','nm');
      var href=cleanUrl(l.url);
      if(href){var a=el('a',null,l.name);a.href=href;a.target='_blank';a.rel='noopener noreferrer nofollow';nm.appendChild(a)}else nm.appendChild(document.createTextNode(l.name));
      nm.appendChild(el('span','badge b-'+l.status,l.status==='approved'?'Live':l.status==='rejected'?'Removed':'Pending'));
      left.appendChild(nm);
      if(l.pitch)left.appendChild(el('div','pt',l.pitch));
      left.appendChild(el('div','meta',l.url));
      left.appendChild(el('div','meta',(rank[l.id]?'Rank #'+rank[l.id]+' · ':'')+l.total_paid+' credits · '+l.clicks+' clicks · added '+new Date(l.created_at).toLocaleDateString()));
      r.appendChild(left);
      var acts=el('div','acts');
      function add(label,cls,status){var b=el('button','btn small '+cls,label);b.type='button';b.addEventListener('click',function(){setStatus(l,status,b)});acts.appendChild(b)}
      if(l.status==='pending'){add('Approve','ok','approved');add('Reject','bad','rejected')}
      else if(l.status==='approved'){add('Remove','bad','rejected')}
      else{add('Restore','ok','approved')}
      r.appendChild(acts);out.appendChild(r);
    });
  }

  function setStatus(l,status,btn){
    if(status==='rejected'&&!confirm('Remove “'+l.name+'” from the public leaderboard? You can restore it later.'))return;
    btn.disabled=true;
    authed('/rest/v1/listings?id=eq.'+encodeURIComponent(l.id),{method:'PATCH',body:{status:status},prefer:'return=representation'})
      .then(function(d){
        if(!d||!d.length)throw new Error('Not allowed. Check the admin setup in Supabase.');
        l.status=status;amsg('Updated “'+l.name+'”.',true);render();
      })
      .catch(function(e){amsg('Could not update: '+e.message);btn.disabled=false});
  }

  $('lf').addEventListener('submit',function(e){
    e.preventDefault();
    var em=$('em').value.trim(),pw=$('pw').value;
    if(!em||!pw){lmsg('Enter your email and password.');return}
    $('lb').disabled=true;lmsg('Signing in…');
    call('/auth/v1/token?grant_type=password',{method:'POST',body:{email:em,password:pw}})
      .then(function(d){setSession(d);return checkAdmin()})
      .then(function(ok){
        if(!ok){signOut('This account is not an admin.');return}
        $('pw').value='';lmsg('');start();
      })
      .catch(function(err){lmsg(err.status===400?'Wrong email or password.':'Could not sign in: '+err.message)})
      .then(function(){$('lb').disabled=false});
  });
  $('out').addEventListener('click',function(){signOut('')});
  $('refresh').addEventListener('click',function(){amsg('Refreshing…');load()});
  $('q').addEventListener('input',function(){q=this.value.trim();render()});

  if(S){
    checkAdmin().then(function(ok){if(ok)start();else signOut('This account is not an admin.')})
      .catch(function(){if(!S)return;signOut('')});
  }else showLogin();
})();
</script>
</body>
</html>
